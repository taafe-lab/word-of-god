/* ---------- Base ---------- */
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}

p{margin:0}
strong{font-weight:800}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:6px;height:56px;margin-inline:-18px;padding-inline:8px 14px;
  background:var(--scrim);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:2px solid var(--line-soft)}
.topbar.is-home{position:relative;top:auto;background:transparent;border-bottom-color:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 10px 0 4px;border-radius:12px;font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--ink-2)}
.back svg{width:24px;height:24px}
.topbar-title{flex:1;min-width:0;text-align:center;font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-spacer{flex:1}
.status{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 12px;border-radius:999px;border:2px solid var(--line-soft);background:var(--card);
  font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--ink-2);white-space:nowrap}
.status i{width:9px;height:9px;border-radius:50%;background:var(--ink-3);flex:none}
.status[data-s="saved"] i{background:var(--teal)}
.status[data-s="saving"] i,.status[data-s="syncing"] i{background:var(--mustard);animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.35}}

/* ---------- Home ---------- */
.hero{display:grid;justify-items:center;text-align:center;gap:8px;padding-block:4px 4px}
.hero-art{width:min(100%,260px);height:auto}
.wordmark{font-family:var(--f-display);font-weight:800;font-size:clamp(42px,12vw,60px);line-height:.98;letter-spacing:-.01em;color:var(--ink)}
.wordmark .hl{background:linear-gradient(transparent 60%,var(--hl) 60%,var(--hl) 90%,transparent 90%);padding-inline:4px;border-radius:4px}
.session-group>h3{line-height:1.2}
.tagline{font-family:var(--f-hand);font-weight:600;font-size:20px;color:var(--coral-ink)}
.epigraph{margin:2px 0 0;max-width:30ch;font-size:16px;line-height:1.5;color:var(--ink-3);font-style:italic}
.epigraph cite{display:block;margin-top:3px;font-style:normal;font-family:var(--f-hand);font-weight:600;font-size:13.5px}
.continues{display:grid;gap:12px;margin-top:22px}
.continue{display:grid;grid-template-columns:60px 1fr 22px;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 14px 14px 12px;
  border-radius:var(--radius);background:var(--card);border:2px solid var(--line);box-shadow:4px 4px 0 var(--shadow-ink);transition:transform .12s ease,box-shadow .12s ease}
.continue:active,.feature:active,.session-card:active,.part-card:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--shadow-ink)}
.continue .emblem,.continue .badge{width:60px;height:60px}
.eyebrow{font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--coral-ink)}
.continue-title{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.1;color:var(--ink)}
.continue-next{font-size:15.5px;line-height:1.4;color:var(--ink-2);margin-top:2px}
.bar{height:9px;border-radius:99px;background:var(--paper-2);border:2px solid var(--line-soft);overflow:hidden;margin-top:9px}
.bar>b{display:block;height:100%;border-radius:inherit;background:var(--acc,var(--teal))}
.chev{width:22px;height:22px;color:var(--ink-3)}
.divider{display:flex;align-items:center;gap:12px;margin-block:38px 4px;font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.divider::before,.divider::after{content:"";flex:1;height:2px;border-radius:2px;background:var(--line-soft)}
.divider-note{text-align:center;font-family:var(--f-hand);font-size:15.5px;color:var(--ink-3)}
.feature{display:block;margin-top:16px;border-radius:22px;overflow:hidden;background:var(--card);border:2px solid var(--line);box-shadow:5px 5px 0 var(--shadow-ink);transition:transform .12s ease,box-shadow .12s ease}
.feature svg{display:block;width:100%;height:auto;border-bottom:2px solid var(--line)}
.feature-body{padding:16px 18px 18px;display:grid;gap:6px}
.feature-title{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.05;color:var(--s-story)}
.feature-body p{color:var(--ink-2);font-size:16.5px;line-height:1.5}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pill{display:inline-flex;align-items:center;min-height:28px;padding:0 11px;border-radius:999px;border:2px solid var(--line-soft);font-family:var(--f-display);font-weight:700;font-size:13.5px;color:var(--ink-2);background:var(--card)}
.pill.is-on{border-color:var(--acc,var(--teal));color:var(--acc,var(--teal))}
.folio{margin-top:36px}
.miniature{position:relative;margin:0;aspect-ratio:5/3;max-width:100%;border-radius:var(--radius);overflow:hidden;border:2px solid var(--line);box-shadow:4px 4px 0 var(--shadow-ink);background:var(--paper-2)}
.miniature svg{display:block;width:100%;height:100%}
.folio-head{margin-top:16px;display:grid;gap:3px}
.folio-kicker{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.folio-kicker .eyebrow{color:var(--acc)}
.folio-kicker span:last-child{font-family:var(--f-hand);font-weight:600;font-size:14.5px;color:var(--ink-3)}
.folio-title{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.08;color:var(--acc)}
.folio-blurb{font-size:16.5px;line-height:1.5;color:var(--ink-2)}
.folio-caption{font-family:var(--f-hand);font-size:14px;color:var(--ink-3)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin-top:14px}
.chip{position:relative;display:flex;flex-direction:column;gap:0;min-height:58px;padding:9px 12px 10px;border-radius:14px;text-align:left;background:var(--card);border:2px solid var(--line-soft);transition:transform .12s ease}
.chip:active{transform:scale(.97)}
.chip-name{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.15;color:var(--ink)}
.chip-meta{font-size:13.5px;color:var(--ink-3)}
.chip.is-open{border-color:var(--line);background:color-mix(in srgb,var(--acc) 14%,var(--card));box-shadow:3px 3px 0 var(--shadow-ink)}
.chip.is-open .chip-name{color:var(--acc)}
.chip.is-open .chip-meta{color:var(--ink-2);font-weight:700}
.seal{position:absolute;top:-8px;right:-7px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--mustard);color:var(--on-mustard);border:2px solid var(--line)}
.seal svg{width:13px;height:13px}
.foot{margin-top:46px;padding-top:20px;border-top:2px solid var(--line-soft);display:grid;gap:12px;font-size:15px;color:var(--ink-3)}
.foot p{line-height:1.55}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;font-family:var(--f-display);font-weight:800;font-size:17px;
  letter-spacing:.01em;text-decoration:none;white-space:nowrap;border:2px solid var(--line);transition:transform .1s ease,box-shadow .1s ease}
.btn svg{width:19px;height:19px;flex:none}
.btn-primary{background:var(--coral);color:var(--on-coral);box-shadow:3px 3px 0 var(--shadow-ink)}
.btn-line{background:var(--card);color:var(--ink);box-shadow:3px 3px 0 var(--shadow-ink)}
.btn-quiet{background:transparent;color:var(--ink-2);border-color:var(--line-soft)}
.btn-primary:active,.btn-line:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow-ink)}
.btn[disabled]{opacity:.5}
.btn-done{background:var(--teal);color:#fff;box-shadow:3px 3px 0 var(--shadow-ink)}

/* ---------- Book / course hero ---------- */
.book-hero{display:grid;justify-items:center;text-align:center;gap:6px;padding-block:14px 4px}
.book-hero .emblem,.book-hero .badge{width:112px;height:112px}
.book-title{font-family:var(--f-display);font-weight:800;font-size:clamp(50px,15vw,68px);line-height:1;color:var(--acc)}
.book-sub{font-family:var(--f-hand);font-weight:600;font-size:19px;color:var(--ink-2)}
.meta-row{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:6px}
.meta-row span{padding:3px 11px;border-radius:999px;border:2px solid var(--line-soft);background:var(--card);font-family:var(--f-display);font-weight:700;font-size:13.5px;color:var(--ink-2)}
.book-progress{width:min(100%,340px);margin-top:8px}
.book-progress p{margin-top:6px;font-size:15px;color:var(--ink-3)}
.course-art{width:100%;height:auto;border-radius:var(--radius);border:2px solid var(--line);box-shadow:4px 4px 0 var(--shadow-ink);margin-top:8px}

/* ---------- Content cards ---------- */
.stack{display:grid;gap:16px;margin-top:22px}
.leaf{background:var(--card);border:2px solid var(--line-soft);border-radius:var(--radius);padding:18px 18px 20px}
.leaf>*+*{margin-top:12px}
.rubric-h{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--coral-ink)}
.rubric-h::before{content:"";width:12px;height:12px;border-radius:4px;background:var(--acc,var(--coral));border:2px solid var(--line);transform:rotate(12deg);flex:none}
.leaf h3{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.2;color:var(--ink)}
.lead{font-size:18px;color:var(--ink)}
.dropcap::first-letter{float:left;font-family:var(--f-display);font-weight:800;font-size:3em;line-height:.85;padding:6px 8px 0 0;color:var(--acc,var(--coral))}
.muted{color:var(--ink-2)}
.small{font-size:15.5px}
.hand{font-family:var(--f-hand)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.list li{position:relative;padding-left:22px}
.list li::before{content:"";position:absolute;left:2px;top:.55em;width:10px;height:10px;border-radius:50%;background:var(--acc,var(--coral));border:2px solid var(--line)}
.group-title{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--ink);margin-top:18px!important}
.facts{display:grid;margin:0}
.facts div{display:grid;grid-template-columns:112px 1fr;gap:12px;padding:10px 0;border-top:2px dashed var(--line-soft)}
.facts div:first-child{border-top:0;padding-top:2px}
.facts dt{font-family:var(--f-display);font-weight:800;font-size:14px;color:var(--coral-ink);padding-top:2px}
.facts dd{margin:0;font-size:16.5px;line-height:1.5}
.intro-note{font-family:var(--f-hand);font-size:16px;line-height:1.5;color:var(--ink-2);text-align:center;max-width:34ch;margin:18px auto 0}
.sessions{display:grid;gap:12px;margin-top:16px}
.session-card,.part-card{display:grid;grid-template-columns:48px 1fr 26px;gap:13px;align-items:center;width:100%;text-align:left;padding:12px 14px 12px 12px;
  border-radius:16px;background:var(--card);border:2px solid var(--line);box-shadow:3px 3px 0 var(--shadow-ink);transition:transform .12s ease,box-shadow .12s ease}
.medallion{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--ink);background:var(--card-2)}
.medallion svg{width:18px;height:18px}
.is-done .medallion{background:var(--teal);color:#fff}
.is-next .medallion{background:var(--mustard);color:var(--on-mustard)}
.sc-label{display:block;font-family:var(--f-display);font-weight:800;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--coral-ink)}
.sc-title{display:block;font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.2;color:var(--ink);margin-top:1px}
.sc-state{width:26px;height:26px;color:var(--ink-3)}
.is-done .sc-state{color:var(--teal)}
.soon-card{display:grid;grid-template-columns:48px 1fr;gap:13px;align-items:center;padding:12px 14px 12px 12px;border-radius:16px;border:2px dashed var(--line-soft);color:var(--ink-3)}
.soon-card .medallion{border-style:dashed;border-color:var(--line-soft);color:var(--ink-3);background:transparent}
.soon-card .sc-title{color:var(--ink-2)}
.session-group{display:grid;gap:10px}
.session-group>h3{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--ink);margin-top:6px}
.session-group>p{font-size:15.5px;color:var(--ink-3);margin-top:-6px}

/* Session / part page */
.session-head{display:grid;justify-items:center;text-align:center;gap:6px;padding-block:18px 2px}
.medallion.big{width:72px;height:72px;font-size:28px;box-shadow:3px 3px 0 var(--shadow-ink);background:var(--mustard);color:var(--on-mustard)}
.medallion.big svg{width:26px;height:26px}
.session-head h1{font-family:var(--f-display);font-weight:800;font-size:33px;line-height:1.1;color:var(--ink)}
.read-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:10px}
.q-list{list-style:none;margin:0;padding:0;display:grid;gap:18px;counter-reset:q}
.q-list li{counter-increment:q}
.q-text{display:grid;grid-template-columns:30px 1fr;gap:6px;font-weight:700}
.q-text::before{content:counter(q);display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--mustard);color:var(--on-mustard);border:2px solid var(--line);font-family:var(--f-display);font-size:14px}
textarea.page-lines{display:block;width:100%;margin-top:10px;min-height:96px;resize:none;border:2px solid var(--line-soft);border-radius:14px;background-color:var(--field);
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 29px,var(--field-line) 29px,var(--field-line) 30px);background-attachment:local;background-position:0 6px;
  line-height:30px;padding:6px 13px 8px;font-family:var(--f-hand);font-size:17px;color:var(--ink)}
textarea.page-lines::placeholder{color:var(--ink-3)}
textarea.page-lines:focus{outline:none;border-color:var(--teal)}
.pray p{font-family:var(--f-hand);font-size:18.5px;line-height:1.55}
.jesus-box{background:color-mix(in srgb,var(--coral) 12%,var(--card));border:2px solid var(--line);border-radius:var(--radius);padding:16px 18px 18px;box-shadow:3px 3px 0 var(--shadow-ink)}
.jesus-box .rubric-h{color:var(--coral-ink)}
.jesus-box .rubric-h::before{background:var(--coral)}
.jesus-box p{margin-top:8px}
.ask-out{white-space:pre-wrap;font-size:16.5px;line-height:1.6;padding:14px 15px;border-radius:14px;background:var(--card-2);border:2px solid var(--line-soft)}
.ask-row{display:flex;flex-wrap:wrap;gap:10px}
.session-bar,.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--scrim);border-top:2px solid var(--line-soft);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.session-bar{padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px))}
.session-bar .inner{max-width:640px;margin:0 auto;display:grid;grid-template-columns:48px 1fr 48px;gap:10px;align-items:center}
.icon-btn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);color:var(--ink);background:var(--card)}
.icon-btn svg{width:22px;height:22px}
.icon-btn[aria-disabled="true"]{opacity:.3;pointer-events:none}
.session-bar .btn{width:100%}
.tabbar{padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar .inner{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(var(--tabs,4),1fr)}
.tab{display:grid;justify-items:center;gap:2px;min-height:52px;padding-top:5px;color:var(--ink-3);font-family:var(--f-display);font-weight:700;font-size:13px}
.tab svg{width:25px;height:25px}
.tab[aria-current="page"]{color:var(--acc)}

/* Mark guide pieces */
.conn{display:grid;gap:4px;padding:12px 0;border-top:2px dashed var(--line-soft)}
.conn:first-of-type{border-top:0}
.conn-refs{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.conn-ot{font-family:var(--f-display);font-weight:800;font-size:17px;color:var(--coral-ink)}
.conn-mark{font-family:var(--f-hand);font-weight:700;font-size:15px;color:var(--teal-ink)}
.conn p{font-size:16.5px;line-height:1.5;color:var(--ink-2)}
.acts{display:grid;gap:10px}
.act{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:14px 14px 15px 12px;border-radius:14px;border:2px solid var(--line-soft);background:var(--card-2)}
.act .medallion{width:40px;height:40px;font-size:15px}
.act-name{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.15}
.act-ref{font-family:var(--f-hand);font-size:14px;color:var(--ink-3)}
.act-theme{font-weight:800;font-size:17px;color:var(--coral-ink);margin-top:3px}
.act ul{margin:6px 0 0;padding:0;list-style:none;font-size:15.5px;line-height:1.45;color:var(--ink-2)}
.turn{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;font-family:var(--f-hand);font-weight:700;font-size:14.5px;color:var(--coral-ink)}
.turn span{max-width:15em;text-align:center;line-height:1.35}
.turn::before,.turn::after{content:"";border-top:3px dashed var(--coral);opacity:.7}
.sons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sons div{display:grid;justify-items:center;gap:5px;font-size:14px;line-height:1.3;color:var(--ink-2)}
.sons b{display:grid;place-items:center;width:54px;height:54px;border-radius:50%;font-family:var(--f-display);font-size:15px;background:var(--mustard);color:var(--on-mustard);border:2px solid var(--line)}
.verse{display:grid;gap:2px;padding:12px 0;border-top:2px dashed var(--line-soft)}
.verse:first-of-type{border-top:0}
.verse-ref{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--teal-ink);text-decoration:none}
.verse p{font-size:16.5px;color:var(--ink-2)}
details.q{background:var(--card);border:2px solid var(--line-soft);border-radius:16px}
details.q summary{list-style:none;display:grid;grid-template-columns:30px 1fr 22px;gap:8px;align-items:start;padding:14px 14px 14px 12px;cursor:pointer;font-weight:700}
details.q summary::-webkit-details-marker{display:none}
details.q summary b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--mustard);color:var(--on-mustard);border:2px solid var(--line);font-family:var(--f-display);font-size:14px}
details.q summary svg{width:20px;height:20px;color:var(--ink-3);margin-top:3px;transition:transform .2s ease}
details.q[open] summary svg{transform:rotate(180deg)}
details.q .ans{padding:0 16px 16px 50px;color:var(--ink-2)}
.ans-note{display:block;font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--teal-ink);margin-bottom:2px}
.answers{display:grid;gap:14px}
.answer{display:grid;gap:3px;padding-top:12px;border-top:2px dashed var(--line-soft)}
.answer:first-child{border-top:0;padding-top:0}
.answer .q{font-size:15px;color:var(--ink-3)}
.answer .a{white-space:pre-wrap;font-family:var(--f-hand)}
.empty{font-family:var(--f-hand);color:var(--ink-3)}

/* ---------- Big Story figures ---------- */
.figure{margin:4px 0 0}
.figcap{margin-top:8px;font-family:var(--f-hand);font-size:14px;color:var(--ink-3);text-align:center}
.path{list-style:none;margin:0;padding:0;display:grid;gap:0;position:relative}
.path li{position:relative;display:grid;grid-template-columns:52px 1fr;gap:12px;padding-bottom:18px}
.path li:last-child{padding-bottom:0}
.path li::before{content:"";position:absolute;left:25px;top:48px;bottom:0;border-left:3px dashed var(--line-soft)}
.path li:last-child::before{display:none}
.path .stop{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--c);box-shadow:3px 3px 0 var(--shadow-ink)}
.path .stop svg{width:30px;height:30px}
.path h4{margin:2px 0 0;font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.15}
.path .ref{font-family:var(--f-hand);font-size:14px;color:var(--ink-3)}
.path p{font-size:16px;line-height:1.5;color:var(--ink-2);margin-top:3px}
.bookends{display:grid;gap:8px}
.bookends .head,.bookends .row{display:grid;grid-template-columns:1fr 24px 1fr;gap:6px;align-items:stretch}

      rows:[[`Author`,`John Mark. The book doesn't name its author, but early church tradition links Mark to Peter's preaching.`],
        [`Written`,`Probably the late 60s AD, soon after Peter was killed in Rome (about AD 64).`],
        [`First readers`,`Mostly non-Jewish Christians, very likely in Rome.`],
        [`Setting`,`Galilee and Jerusalem, around AD 30.`],
        [`Type`,`Gospel: a biography of Jesus, told as a fast-moving story.`],
        [`Length`,`16 chapters, about an hour to read straight through.`],
        [`Key verse`,`Mark 10:45: Jesus came to serve others and to give his life as a ransom for many.`]] },
    world:{ lead:`Mark tells the story of events around AD 30, written for Christians in Rome who were facing persecution more than 30 years later. It helps to keep both worlds in mind as you read.`,
      groups:[
        { title:`Jesus' world, around AD 30`, items:[
          [`Rome was in charge.`,`Herod Antipas, a son of Herod the Great, ruled Galilee for Rome. He is the “King Herod” who has John the Baptist executed in chapter 6. Judea, including Jerusalem, was under a Roman governor, Pontius Pilate.`],
          [`The Temple was the centre of Jewish life.`,`It was run by the high priest and the leading priests, who kept the peace with Rome.`],
          [`Groups you'll meet.`,`Pharisees were strict about keeping God's law and the traditions around it, such as the Sabbath and ritual washing. The teachers of religious law were the experts who interpreted it. Sadducees came from the priestly elite and didn't believe in the resurrection (12:18). Herodians supported Herod's family (3:6; 12:13).`],
          [`People hoped for a Messiah.`,`Many expected a king from David's family who would drive out Rome. Because the title was so political, Jesus avoids claiming it in public until his trial (14:61–62).`],
          [`The story moves from Galilee to Jerusalem.`,`Galilee was rural and far from the Temple, while Jerusalem was the religious and political centre. The opposition to Jesus grows as he heads south.`]]},
        { title:`Mark's readers' world, the late 60s AD`, items:[
          [`Persecution in Rome.`,`After the great fire of Rome in AD 64, Emperor Nero blamed and killed Christians. Church tradition says Peter died then.`],
          [`War in Judea.`,`The Jewish revolt against Rome began in AD 66, and the Romans destroyed Jerusalem and the Temple in AD 70.`],
          [`What to listen for.`,`Mark's first readers knew what following Jesus could cost. Notice how often Mark talks about suffering and staying faithful (4:17; 8:34–38; 10:30; 13:9–13).`],
          [`Clues that the readers were Romans, not Jews.`,`Mark explains Jewish customs (7:3–4) and translates Aramaic words (5:41). He uses Latin terms like “centurion” (15:39), and explains two small Greek coins using a Roman one (12:42). He names Simon of Cyrene's sons, Alexander and Rufus, as if his readers knew them (15:21). Paul greets a Rufus in his letter to the Romans (16:13), possibly the same man.`]]}]},
    story:{ lead:`Mark opens by quoting the prophets and keeps using the Old Testament to explain who Jesus is. Look these passages up in your NLT when you reach them.`,
      rows:[[`Isaiah 40:3 and Malachi 3:1`,`Mark 1:2–3`,`John prepares the way for the Lord himself. Mark names only Isaiah, following the Jewish habit of naming the best-known source.`],
        [`Psalm 2:7 and Isaiah 42:1`,`Mark 1:11`,`God's words at the baptism echo the promised king and the chosen servant.`],
        [`Daniel 7:13–14`,`Mark 8:38; 13:26; 14:62`,`“Son of Man”, Jesus' favourite title for himself, is the figure who receives God's everlasting kingdom.`],
        [`Isaiah 53`,`Mark 10:45; 14:24`,`“A ransom for many” echoes the servant who suffers for many.`],
        [`Psalm 118:22–26`,`Mark 11:9; 12:10–11`,`The crowd's welcome into Jerusalem, and the rejected stone that becomes the cornerstone.`],
        [`Isaiah 56:7 and Jeremiah 7:11`,`Mark 11:17`,`Jesus' verdict on the Temple: a house of prayer turned into a den of thieves.`],
        [`Zechariah 13:7`,`Mark 14:27`,`The shepherd is struck and the sheep scatter.`],
        [`Psalm 22:1`,`Mark 15:34`,`Jesus' cry from the cross quotes the opening line of a psalm that ends in trust and victory.`]],
      other:`**Mark and the other Gospels.** Matthew, Mark and Luke are called the “Synoptic” Gospels, from the Greek for “seen together”, because they share many of the same stories, often in the same order. Most scholars think Matthew and Luke used Mark as a source and followed his Galilee-to-Jerusalem outline. John tells the story differently, with long speeches and several visits to Jerusalem. Starting with Mark gives you the core story, so the other Gospels will feel familiar when you reach them.` },
    shape:{ lead:`Mark moves in three acts from Galilee to Jerusalem, and turns on Peter's confession halfway through.`,
      acts:[{n:'I', name:`Galilee`, ref:`Mark 1:1–8:21`, theme:`Who is this man?`, lines:[`Miracles, parables and conflict`,`Crowds amazed, leaders hostile`,`Disciples slow to understand`]},
        {n:'II', name:`On the way`, ref:`Mark 8:22–10:52`, theme:`What kind of Messiah?`, lines:[`Jesus predicts his death three times`,`The disciples miss the point`,`Framed by two blind men healed`]},
        {n:'III', name:`Jerusalem`, ref:`Mark 11:1–16:8`, theme:`A king crowned on a cross`, lines:[`The Temple judged, the leaders plot`,`Trial, cross and empty tomb`,`It ends in fear, with a promise`]}],
      turn:`Turning point: Peter's confession (8:27–30)`,
      sonsLabel:`Jesus is declared God's Son at the start, middle and end`,
      sons:[[`1:11`,`God's voice at his baptism`],[`9:7`,`God's voice at the transfiguration`],[`15:39`,`A Roman officer at the cross`]],
      after:`The first half builds up to Peter's answer to the question everyone is asking: who is this man (4:41; 8:29)? The second half shows what kind of Messiah Jesus is: one who serves and gives his life (10:45). Your sessions follow this shape.` },
    themes:{ lead:`Everything in Mark serves one question: who is Jesus, and what does it mean to follow him?`,
      items:[[`Who Jesus is.`,`Mark's first line calls Jesus the Messiah and the Son of God (1:1). God, demons, Jesus himself and finally a Roman officer all say it (1:11; 3:11; 9:7; 14:61–62; 15:39). Meanwhile, the disciples struggle to see it.`],
        [`God's kingdom has arrived.`,`Jesus' first message is that the kingdom of God is near, so people must repent and believe the good news (1:14–15). His healings and his power over demons show God's rule breaking in.`],
        [`A Messiah who must die.`,`From 8:31 onwards, Jesus says his death is necessary and part of God's plan. He gives his life as a ransom for many (10:45), and his blood seals a new covenant (14:24).`],
        [`The “Messianic secret”.`,`Jesus keeps telling people not to say who he is (1:34, 44; 3:12; 8:30). The title Messiah was easily misread as political, and Jesus can only be properly understood through the cross. Even so, the news keeps spreading (7:36).`],
        [`Following means carrying a cross.`,`Following Jesus means denying yourself and taking up your cross (8:34), even through persecution (13:9–13). True greatness means serving others (10:42–45).`],
        [`Fear, faith and failure.`,`People often react to Jesus with fear (4:41; 5:15; 16:8), and he calls them to faith instead (5:36). The disciples fail again and again, and Peter denies him (14:66–72). Yet the angel's message after the resurrection names Peter specifically (16:7).`]] },
    reading:{ lead:`Mark is a skilled storyteller, and five habits will help you notice what he's doing.`,
      items:[[`Feel the pace.`,`Mark's favourite word is “immediately” (Greek *euthys*), which he uses more than 40 times. He often tells the story in the present tense to create urgency. English translations vary the wording, so watch for “at once” and “right away” too.`],
        [`Spot the sandwiches.`,`Mark often starts one story, interrupts it with a second, then finishes the first. The two stories explain each other: Jesus' family and the accusation about demons (3:20–35), Jairus's daughter and the bleeding woman (5:21–43), the fig tree and the Temple (11:12–25), and Peter's denial and Jesus' trial (14:53–72).`],
        [`Watch insiders and outsiders.`,`The disciples, who should understand, keep missing the point (6:52; 8:17–21). Meanwhile, outsiders show faith and insight: a bleeding woman, a Gentile mother (7:24–30), blind Bartimaeus (10:46–52) and a Roman officer (15:39).`],
        [`Hear it as a story.`,`Most of Mark's first audience would have heard it read aloud in one go. Try reading it straight through at least once. It takes about an hour.`],
        [`Notice the ending.`,`The oldest manuscripts end at 16:8, with the women running from the empty tomb in fear. That's why most modern Bibles set verses 9–20 apart with a note. There's more on this in Go deeper.`]] },
    deeper:{ lead:`These are the questions scholars debate about Mark. None of them changes the heart of the story, but they help you read it with your eyes open.`,
      items:[[`Who wrote it?`,`The book is anonymous. The earliest evidence comes from Papias, a bishop writing in the early 100s AD, as quoted by the historian Eusebius. Papias said Mark was Peter's interpreter and wrote down accurately what Peter remembered, though not in order. Tradition consistently names John Mark. He grew up in Jerusalem (Acts 12:12) and abandoned Paul on a mission trip (Acts 13:13), but was later welcomed back (Colossians 4:10; 2 Timothy 4:11; 1 Peter 5:13). Tyndale's notes argue that no one would credit a Gospel to someone with that record unless it were true. Some scholars doubt the link with Peter.`],
        [`When was it written?`,`Tyndale's notes favour the late 60s, after Peter's death and probably after the Jewish revolt began in AD 66. The evidence is Mark's focus on persecution and the warnings in chapter 13. Some scholars date it earlier, in the 50s, while others place it just after AD 70.`],
        [`Which Gospel came first?`,`Most scholars think Mark came first and that Matthew and Luke used it. They repeat most of Mark's stories, often word for word, and tend to smooth out his rougher Greek. A minority of scholars think Matthew came first.`],
        [`How does Mark end?`,`The two best early Greek manuscripts, Codex Sinaiticus and Codex Vaticanus (both from the 300s), stop at 16:8. Nearly all scholars agree that Mark didn't write the shorter or longer endings found in later manuscripts. Many also doubt he meant to stop at 16:8. The last word of that verse in Greek is *gar* (“for”), a very unusual way to end a book, and 16:7 promises a meeting in Galilee that the book never describes. Some think the original ending was lost, while others think Mark ended abruptly on purpose to leave the reader with a response to make.`],
        [`The Aramaic words Mark keeps.`,`Mark records several of Jesus' words in Aramaic, the language Jesus spoke, and translates them for Greek-speaking readers: *Boanerges* (“Sons of Thunder”, 3:17), *Talitha koum* (“Little girl, get up”, 5:41), *Ephphatha* (“Be opened”, 7:34), *Abba* (“Father”, 14:36) and Jesus' cry from the cross (15:34).`],
        [`A signature?`,`Only Mark mentions the young man who ran away naked when Jesus was arrested (14:51–52). Some think it was Mark himself, but that can't be proved.`]] },
    verses:{ lead:`Pick one or two to learn by heart. Write them out from your NLT onto a card or your phone's lock screen.`,
      rows:[[`Mark 1:15`,`God's kingdom is near, so repent and believe the good news.`],
        [`Mark 8:34–35`,`To follow Jesus, deny yourself and take up your cross. Losing your life for him is how you save it.`],
        [`Mark 10:45`,`Jesus came to serve, not to be served, and to give his life as a ransom for many.`],
        [`Mark 14:36`,`In Gethsemane, Jesus asks for another way but chooses his Father's will over his own.`],
        [`Mark 15:39`,`At the cross, a Roman officer recognises that Jesus truly was the Son of God.`]] },
  },
  quiz:[
    [`What does Mark's first verse tell you about Jesus?`,`He is the Messiah (the Christ) and the Son of God (1:1).`],
    [`Mark's opening quote blends two prophets. Which one does he name, and why only one?`,`Isaiah. The quote also uses Malachi 3:1, but Jewish writers often named only the best-known source.`],
    [`Where is the book's turning point, and what happens there?`,`At Caesarea Philippi, Peter says Jesus is the Messiah (8:29). Straight afterwards, Jesus first predicts his death (8:31).`],
    [`How many times does Jesus predict his death, and how do the disciples respond?`,`Three times (8:31; 9:31; 10:33–34). Each time the disciples miss the point: Peter objects, the others argue about who is greatest, and James and John ask for the best seats.`],
    [`Name two of Mark's sandwich stories. What does each pairing teach?`,`Any two of these: the fig tree and the Temple (judgment on a place with no fruit); Jairus's daughter and the bleeding woman (faith); Jesus' family and the accusation about demons (misunderstanding Jesus); Peter's denial and Jesus' trial (Jesus stays faithful while Peter fails).`],
    [`What is a ransom, and why does it matter in 10:45?`,`A payment to free a slave or captive. Jesus' death is the price of our freedom.`],
    [`Apart from God and the demons, who is the first person in the story to call Jesus the Son of God?`,`The Roman officer at the cross (15:39).`],
    [`Why did Mark's first readers in Rome especially need this Gospel?`,`They were facing persecution under Nero. Mark shows that the true King suffered first, and that following him means taking up your cross.`],
    [`Why do most modern Bibles set 16:9–20 apart?`,`The oldest manuscripts end at 16:8.`],
  ],
  sources:[
    [`Tyndale Open Study Notes`,`https://tyndaleopenresources.com/`,`© 2023 Tyndale House Publishers, used through the Aquifer Open Study Notes adaptation by Mission Mutual. Both are licensed under CC BY-SA 4.0; this guide adapts that material and is shared under the same licence.`],
    [`Aquifer Open Study Notes`,`https://github.com/BibleAquifer/AquiferOpenStudyNotes`,`The book introduction and verse notes for Mark.`],
    [`BibleProject: Mark overview`,`https://bibleproject.com/videos/mark/`,`Free animated overview of the book.`],
    [`CC BY-SA 4.0 licence`,`https://creativecommons.org/licenses/by-sa/4.0/`,`The terms this guide's notes are shared under.`],
  ],
};

const COURSE = {
  id:'story', name:'The Big Story', sub:'Genesis to Revelation in eight sessions',
  intro:`The Bible is a library of 66 books, but it tells one story: God making a world, losing it to rebellion and winning it back through Jesus. These eight sessions walk through that story, so every book you study later has a place to fit.`,
  sessions:[
    { n:1, title:`The whole story on one page`, range:`Genesis to Revelation`, parts:[
      { n:1, title:`One story in six acts`, read:[`Genesis 1–3`,`Revelation 21–22`],
        lead:`Start with the first three chapters and the last two chapters of the Bible. Read side by side, they show where the story begins and where it is going.`,
        learn:[
          ['p',`The Bible was written by many authors over more than a thousand years, in Hebrew, Aramaic and Greek. It holds poems, laws, letters, histories and visions. Yet it tells one story, and it helps to see that story as a drama in six acts.`],
          ['fig','acts',`The six acts of the Bible's story`],
          ['p',`Seeing the Bible as a drama in acts is a well-known teaching approach, popularised by Craig Bartholomew and Michael Goheen in *The Drama of Scripture*. The names of the acts here are this app's own.`],
          ['h',`The bookends`],
          ['p',`The Bible's first pages and last pages mirror each other. What is lost in Genesis 3 is restored in Revelation 21–22.`],
          ['fig','bookends',`Genesis and Revelation mirror each other`]],
        jesus:`Jesus stands at the centre of the six acts. Everything before him leads up to him, and everything after flows from what he did. In the Bible's last chapter he describes himself as the beginning and the end of the whole story (Revelation 22:13).`,
        reflect:[`Which of the six acts do you know least well? What would you like to understand better?`,`Looking at the bookends, what has been lost since Genesis 3 that you long to see restored, in the world or in your own life?`,`Where do you see yourself in the story right now? (A clue: we live in Act 5.)`],
        pray:`Thank God that the story doesn't end in Genesis 3. Ask him to help you read the whole Bible as one story that leads to Jesus.` },
      { n:2, title:`The story in time`, read:[`Acts 7`],
        lead:`In Acts 7, Stephen races through Israel's history, from Abraham to Solomon, and ends at Jesus. It's a good way to feel the flow of the story before you look at the timeline.`,
        learn:[
          ['p',`Here is the story laid out in time. Dates before about 1000 BC are approximate and some are debated, so treat them as rough guides.`],
          ['fig','timeline',`The Bible's story from creation to new creation`],
          ['p',`**BC and AD.** BC means “before Christ”. AD stands for the Latin *anno Domini*, “in the year of the Lord”. Some books use BCE and CE instead, with the same numbers. Years BC count down towards Jesus' birth.`],
          ['p',`**Where the books fit.** The history books, Genesis to Esther, run in roughly the right order. The poetry and the prophets don't come after them in time. Most were written during the same centuries, between David and the return from exile.`]],
        jesus:`Stephen ends his speech by naming Jesus as the Righteous One the prophets spoke about (Acts 7:52). The whole timeline leads to that moment.`,
        reflect:[`What surprised you about the order of events?`,`Stephen showed a pattern in Israel's story: God kept reaching out, and his people kept resisting (Acts 7:51). Where do you see that pattern in your own life?`,`Which part of the timeline are you most looking forward to studying?`],
        pray:`Thank God for being faithful through thousands of years of history, and ask him to help you trust him with your own story.` },
      { n:3, title:`How the library is arranged`, read:[`Psalm 19`,`2 Timothy 3:14–17`],
        lead:`Psalm 19 celebrates God speaking through creation and through his word. Paul's words to Timothy explain what the Scriptures are for.`,
        learn:[
          ['p',`The Bible has 66 books: 39 in the Old Testament and 27 in the New. They are grouped by type rather than by date. That's why the prophets come after Esther, even though most of them lived earlier.`],

/* ================= Illustrations: flat, outlined, drawn in code ================= */
const ART = (() => {
  const W = 400, H = 240, PI = Math.PI, NAVY = '#22314A';
  const f = n => Math.round(n * 10) / 10;
  const O = `stroke="${NAVY}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"`;
  const Othin = `stroke="${NAVY}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"`;
  function rng(seed) {
    let a = seed >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  const pick = (r, a) => a[Math.floor(r() * a.length)];
  function smooth(pts, closed) {
    const n = pts.length, P = i => closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))];
    let d = `M${f(pts[0][0])},${f(pts[0][1])}`;
    const last = closed ? n : n - 1;
    for (let i = 0; i < last; i++) {
      const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
      d += ` C${f(p1[0] + (p2[0] - p0[0]) / 6)},${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)},${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])},${f(p2[1])}`;
    }
    return d + (closed ? ' Z' : '');
  }
  function ridge(base, amp, seed, n = 7) {
    const r = rng(seed), a = r() * 6.28, b = r() * 6.28, pts = [];
    for (let i = 0; i <= n; i++) pts.push([-20 + (W + 40) * i / n, base - amp * (0.6 * Math.sin(i * 0.95 + a) + 0.4 * Math.sin(i * 1.9 + b))]);
    return smooth(pts) + ` L${W + 20},${H + 20} L-20,${H + 20} Z`;
  }
  const hill = (base, amp, seed, fill) => `<path d="${ridge(base, amp, seed)}" fill="${fill}" ${O}/>`;
  function blob(cx, cy, rx, ry, seed, bumps = 9, depth = .1) {
    const r = rng(seed), pts = [];
    for (let i = 0; i < bumps; i++) {
      const a = i / bumps * PI * 2, k = 1 + (i % 2 ? depth : -depth * .4) + (r() - .5) * depth * .6;
      pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]);
    }
    return smooth(pts, true);
  }
  const sun = (x, y, rr, fill, rays) => {
    let s = '';
    if (rays) for (let i = 0; i < 12; i++) { const a = i / 12 * PI * 2; s += `<path d="M${f(x + Math.cos(a) * (rr + 6))},${f(y + Math.sin(a) * (rr + 6))} L${f(x + Math.cos(a) * (rr + 14))},${f(y + Math.sin(a) * (rr + 14))}" stroke="${NAVY}" stroke-width="2.2" stroke-linecap="round"/>`; }
    return s + `<circle cx="${x}" cy="${y}" r="${rr}" fill="${fill}" ${O}/>`;
  };
  const cloud = (x, y, k) => `<path d="M${f(x - 22 * k)},${f(y)} C${f(x - 26 * k)},${f(y - 10 * k)} ${f(x - 14 * k)},${f(y - 16 * k)} ${f(x - 7 * k)},${f(y - 11 * k)} C${f(x - 4 * k)},${f(y - 22 * k)} ${f(x + 12 * k)},${f(y - 22 * k)} ${f(x + 13 * k)},${f(y - 11 * k)} C${f(x + 22 * k)},${f(y - 14 * k)} ${f(x + 28 * k)},${f(y - 4 * k)} ${f(x + 22 * k)},${f(y)} Z" fill="#FFFDF6" ${O}/>`;
  function birds(r, n, x0, x1, y0, y1) {
    let s = '';
    for (let i = 0; i < n; i++) { const x = x0 + r() * (x1 - x0), y = y0 + r() * (y1 - y0), k = 3.5 + r() * 2.5; s += `<path d="M${f(x - k)},${f(y)} Q${f(x - k / 2)},${f(y - k * .8)} ${f(x)},${f(y)} Q${f(x + k / 2)},${f(y - k * .8)} ${f(x + k)},${f(y)}"/>`; }
    return `<g fill="none" stroke="${NAVY}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${s}</g>`;
  }
  const sparkle = (x, y, k, c) => `<path d="M${x},${f(y - k)} Q${f(x + k * .2)},${f(y - k * .2)} ${f(x + k)},${y} Q${f(x + k * .2)},${f(y + k * .2)} ${x},${f(y + k)} Q${f(x - k * .2)},${f(y + k * .2)} ${f(x - k)},${y} Q${f(x - k * .2)},${f(y - k * .2)} ${x},${f(y - k)} Z" fill="${c}"/>`;
  function flowers(r, n, x0, x1, y0, y1, cols) {
    let s = '';
    for (let i = 0; i < n; i++) {
      const x = x0 + r() * (x1 - x0), y = y0 + r() * (y1 - y0), c = pick(r, cols);
      s += `<g><circle cx="${f(x - 2.2)}" cy="${f(y)}" r="2" fill="${c}"/><circle cx="${f(x + 2.2)}" cy="${f(y)}" r="2" fill="${c}"/><circle cx="${f(x)}" cy="${f(y - 2.2)}" r="2" fill="${c}"/><circle cx="${f(x)}" cy="${f(y + 2.2)}" r="2" fill="${c}"/><circle cx="${f(x)}" cy="${f(y)}" r="1.5" fill="#F2C14E"/></g>`;
    }
    return s;
  }
  function treeBlob(x, y, h, rx, ry, seed, leaf, light, fruit) {
    const r = rng(seed);
    let s = `<path d="M${x - 5},${y} C${x - 4},${y - h * .4} ${x - 6},${y - h * .7} ${x - 2},${y - h} L${x + 3},${y - h} C${x + 6},${y - h * .7} ${x + 5},${y - h * .4} ${x + 6},${y} Z" fill="#9A6441" ${O}/>`;
    s += `<path d="${blob(x, y - h - ry * .55, rx, ry, seed, 11, .12)}" fill="${leaf}" ${O}/>`;
    s += `<path d="${blob(x - rx * .25, y - h - ry * .85, rx * .45, ry * .35, seed + 1, 8, .1)}" fill="${light}"/>`;
    if (fruit) for (let i = 0; i < fruit; i++) {
      const a = r() * PI * 2, d = Math.sqrt(r()) * .75;
      s += `<circle cx="${f(x + Math.cos(a) * rx * d)}" cy="${f(y - h - ry * .55 + Math.sin(a) * ry * d)}" r="3.4" fill="${pick(r, ['#E0634C', '#EAB445', '#F08C6A', '#C24B7A', '#8E5AC8'])}" ${Othin}/>`;
    }
    return s;
  }
  function sheep(x, y, k, dir) {
    const d = dir ? 1 : -1;
    return `<g><path d="M${f(x - 5 * k)},${f(y + 3 * k)} v${f(6 * k)} M${f(x + 4 * k)},${f(y + 3 * k)} v${f(6 * k)}" stroke="${NAVY}" stroke-width="${f(2 * k)}" stroke-linecap="round"/><path d="${blob(x, y, 10 * k, 6.8 * k, Math.round(x * 7 + y), 10, .16)}" fill="#FFFDF6" ${O}/><ellipse cx="${f(x + d * 10 * k)}" cy="${f(y - 2 * k)}" rx="${f(3.6 * k)}" ry="${f(4.2 * k)}" fill="${NAVY}"/><circle cx="${f(x + d * 11.2 * k)}" cy="${f(y - 3 * k)}" r="${f(.8 * k)}" fill="#FFFDF6"/></g>`;
  }
  function bird(x, y, c, flip) {
    const d = flip ? -1 : 1;
    return `<g><path d="M${x - d * 6},${y + 1} L${x - d * 12},${y + 4} L${x - d * 6},${y + 5} Z" fill="${c}" ${Othin}/><ellipse cx="${x}" cy="${y}" rx="7.5" ry="5.4" fill="${c}" ${Othin}/><circle cx="${x + d * 6}" cy="${y - 3.5}" r="3.8" fill="${c}" ${Othin}/><path d="M${x + d * 9.4},${y - 4} l${d * 4},1.2 l${-d * 4},1.4 Z" fill="#EAB445" ${Othin}/><circle cx="${x + d * 6.8}" cy="${y - 4.2}" r=".9" fill="${NAVY}"/></g>`;
  }
  const svg = (label, body, bg) => `<svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${label}" xmlns="http://www.w3.org/2000/svg"><rect width="400" height="240" fill="${bg}"/>${body}</svg>`;
  const band = (y, h, c) => `<rect x="0" y="${y}" width="400" height="${h}" fill="${c}"/>`;

  /* I. Books of Moses: the tree of life */

    const r = rng(7);
    let b = sun(328, 54, 22, '#F2C14E', true) + cloud(70, 58, 1.1) + cloud(210, 34, .8);

    b += `<path d="M40,232 C80,222 110,226 140,218 M232,208 C260,206 284,208 306,206" stroke="#FFFDF6" stroke-width="2" fill="none" stroke-linecap="round"/>`;

    b += flowers(r, 16, 10, 390, 184, 236, ['#FFFFFF', '#F4A097', '#C9A7E8']);

  /* The Bible as a bookcase, 66 spines coloured by part */
  const TINT = { moses: '#9FD1A9', history: '#F2AE8A', wisdom: '#A9C3EE', prophets: '#CDA9DF', gospels: '#F4A097', church: '#8FD2CA', letters: '#F2CD7E', revelation: '#AEB7F2' };
  function bookcase(rows) {
    const Wd = 360, shelfH = 104;
    let s = `<svg class="bookcase" viewBox="0 0 ${Wd} ${rows.length * shelfH + 12}" role="img" aria-label="The 66 books of the Bible on four shelves, coloured by part" xmlns="http://www.w3.org/2000/svg">`;
    rows.forEach((row, ri) => {
      const y0 = 8 + ri * shelfH, base = y0 + 84, n = row.length, gap = 2, bw = (Wd - 20 - gap * (n - 1)) / n;
      row.forEach(([abbr, sec], i) => {
        const h = 60 + ((i * 37 + ri * 11) % 17), x = 10 + i * (bw + gap);
        s += `<rect x="${f(x)}" y="${f(base - h)}" width="${f(bw)}" height="${h}" rx="2.5" fill="${TINT[sec]}" stroke="${NAVY}" stroke-width="1.6"/>`;
        s += `<text transform="translate(${f(x + bw / 2 + 3.2)} ${f(base - 6)}) rotate(-90)" font-family="Nunito, sans-serif" font-weight="800" font-size="${bw < 17 ? 8.4 : 10}" fill="${NAVY}">${abbr}</text>`;
      });
      s += `<rect x="2" y="${base}" width="${Wd - 4}" height="9" rx="3" fill="#B77B4F" stroke="${NAVY}" stroke-width="2"/>`;
    });
    return s + `</svg>`;
  }

  const SCENES = { eden, jerusalem, shepherd, watchman, tomb, sea, lamp, city, galilee };
  const cache = {};
  const memo = (k, fn) => (cache[k] = cache[k] || fn());
  return {
    scene: name => memo('sc-' + name, SCENES[name]),
    emblem: name => memo('em-' + name, name === 'lion' ? lion : name === 'come' ? come : book),
    story: () => memo('story', story),
    act: name => ACT_ICON[name],
    bookcase: rows => memo('bookcase', () => bookcase(rows)),
    TINT,
  };
})();

  const OBJ_FIELDS = { come: ['days', 'verses', 'share', 'start', 'finish'], study: ['done', 'answers'] };
  function blank(k) {
    if (k === 'come') return { days: {}, verses: {}, share: {}, start: {}, finish: {}, updatedAt: 0 };
    if (k.indexOf('study-') === 0) return { done: {}, answers: {}, updatedAt: 0 };
    return { text: '', updatedAt: 0 };
  }
  function data(k) {
    if (!mem[k]) {
      const v = lsGet(k);
      const d = Object.assign(blank(k), v && typeof v === 'object' ? v : {});
      const fields = k === 'come' ? OBJ_FIELDS.come : k.indexOf('study-') === 0 ? OBJ_FIELDS.study : [];
      fields.forEach(f => { if (!d[f] || typeof d[f] !== 'object') d[f] = {}; });
      if (fields.length === 0 && typeof d.text !== 'string') d.text = '';
      mem[k] = d;
    }
    return mem[k];
  }
  function touch(k) {
    const v = data(k);
    v.updatedAt = Date.now();
    if (lsSet(k, v)) {
      setStatus('saving');
      clearTimeout(S.saveTimer);
      S.saveTimer = setTimeout(() => setStatus('saved'), 450);
    } else {
      setStatus('error');
      if (!S.warned) { S.warned = true; toast('This phone wouldn’t let the app save just now. Check you have some free storage, then try again.'); }
    }
  }

  const STATUS_TEXT = { saving: 'Saving', saved: 'Saved', error: 'Not saved' };
  const STATUS_HELP = {
    saving: 'Saving on this phone…',
    saved: 'Everything you write saves on this phone as you type, even with no internet. Make a backup now and then from the bottom of the home page.',
    error: 'This phone wouldn’t let the app save just now. Check you have some free storage, then try again.',
  };
  const SAVE_NOTE = 'Everything you write saves on this phone as you type, even offline. A backup is a small file you can keep in Files or email to yourself, in case anything happens to your phone.';
  function setStatus(s) {
    S.status = s;
    const el = document.getElementById('status');
    if (el) { el.dataset.s = s; el.querySelector('span').textContent = STATUS_TEXT[s]; }
  }

  /* ---------- Offline: the app saves itself to the phone ---------- */
  const OFF_TEXT = { checking: 'Checking', preparing: 'Saving for offline', ready: 'Works offline', none: 'Not offline yet' };
  const OFF_HELP = {
    checking: 'Checking that the app is saved on this phone for offline use…',
    preparing: 'The app is saving itself to this phone so it works offline. Keep it open, with internet, for a few seconds.',
    ready: 'The whole app is saved on this phone, so it works with no internet, including on a plane.',
    none: 'Offline use isn’t ready yet. Open the app from its Home Screen icon while you have internet, wait a few seconds, then check again.',
  };
  function setOffline(s) {
    S.offline = s;
    const el = document.getElementById('offline');
    if (el) { el.dataset.o = s; el.querySelector('span').textContent = OFF_TEXT[s]; }
  }
  async function checkOffline() {
    try {
      if (!window.caches) { setOffline('none'); return; }
      const keys = await caches.keys();
      for (const k of keys) {
        if (k.indexOf('wog-') !== 0) continue;
        const c = await caches.open(k);
        if ((await c.match('index.html')) || (await c.match('./'))) { setOffline('ready'); return; }
      }
      if (S.offTries++ < 40) { setOffline('preparing'); setTimeout(checkOffline, 1500); }
      else setOffline('none');
    } catch (e) { setOffline('none'); }
  }
  function setupOffline() {
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    if (!('serviceWorker' in navigator) || !window.isSecureContext) { setOffline('none'); return; }
    let hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (hadController) toast('The app has been updated. Close it and open it again to see the latest version.');
      hadController = true;
      checkOffline();
    });
    navigator.serviceWorker.register('sw.js', { scope: './' }).then(reg => {
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        if (!w) return;
        w.addEventListener('statechange', () => { if (w.state === 'activated') { S.offTries = 0; checkOffline(); } });
      });
      checkOffline();
    }).catch(() => setOffline('none'));
  }

  /* ---------- Routing ---------- */
  function parse() {
    const h = (location.hash || '').slice(1);
    let m = h.match(/^come(?:-(days|portrait|trust|verses|start|finish|d(\d+)))?$/);
    if (m) {
      if (m[2] != null) { const d = COME.days[+m[2] - 1]; if (d) return { v: 'day', d }; }
      else if (m[1] === 'start') return { v: 'start' };
      else if (m[1] === 'finish') return { v: 'finish' };
      else return { v: 'come', tab: m[1] || 'days' };
    }
    if (h === 'help') return { v: 'help' };
    m = h.match(/^story(?:-(sessions|timeline|notes)|-s(\d+)p(\d+))?$/);
    if (m) {
      if (m[2] != null) { const p = PARTS.find(x => x.s === +m[2] && x.n === +m[3]); if (p) return { v: 'part', p }; }
      else return { v: 'course', tab: m[1] || 'sessions' };
    }
    m = h.match(/^([a-z0-9]+)(?:-(study|guide|notes|quiz|s(\d+)))?$/);
    if (m && BOOKS[m[1]]) {
      if (m[3] != null) { if (BOOKS[m[1]].sessions[+m[3]]) return { v: 'session', book: m[1], n: +m[3] }; }
      else return { v: 'book', book: m[1], tab: m[2] || 'study' };
    }
    return { v: 'home' };
  }
  function progress(id) {

  }
  const nextSession = id => { const d = data('study-' + id); return BOOKS[id].sessions.find(s => !d.done['s' + s.n]); };
  const courseProgress = () => { const d = data('study-story'); return { done: PARTS.filter(p => d.done[p.key]).length, total: PARTS.length }; };
  const nextPart = () => { const d = data('study-story'); return PARTS.find(p => !d.done[p.key]); };

  /* ---------- Come and See helpers ---------- */

  function portraitTab() {
    const items = COME.days.map(d => ({ d, t: (dayRec(d.n).see || '').trim() })).filter(x => x.t);
    let h = `<div class="stack"><section class="leaf"><h2 class="rubric-h">My portrait of Jesus</h2><p class="muted">Every “Today I saw that Jesus…” you write is gathered here. By the end of the 60 days, you’ll have a portrait of Jesus in your own words.</p>`;
    if (items.length) {
      h += `<p class="portrait-count"><b>${items.length}</b>${items.length === 1 ? 'thing' : 'things'} you’ve seen in Jesus</p></section><section class="leaf"><ol class="portrait-list">${items.map(x => `<li><a class="sc-label" href="#come-d${x.d.n}">Day ${x.d.n} · ${esc(x.d.ref)}</a><p class="portrait-line">${esc(x.t)}</p></li>`).join('')}</ol></section><div><button class="btn btn-line" type="button" data-act="copy-portrait">${ICON.copy}Copy my portrait</button></div>`;
    } else h += `<p class="empty">Nothing here yet. After you read each day, finish the sentence “Today I saw that Jesus…” and it will appear here.</p></section>`;

  }
  function cairn(n) {
    const rows = [5, 4, 3, 2, 1], tones = ['#CDBB9E', '#B9A688', '#D9C9AC', '#AE9B80', '#C7B496'];
    const W = 250, sw = 46, sh = 26;
    let s = '', k = 0;
    rows.forEach((cnt, ri) => {
      const y = 156 - (ri + 1) * (sh - 3), x0 = (W - cnt * sw) / 2;
      for (let i = 0; i < cnt; i++) {
        const on = k < n; k++;
        const cx = x0 + i * sw + sw / 2, cy = y + sh / 2;
        s += on
          ? `<ellipse cx="${cx}" cy="${cy}" rx="${sw / 2 - 2}" ry="${sh / 2 - 1}" style="fill:${tones[(i + ri * 2) % tones.length]};stroke:var(--line);stroke-width:2.2"/>`
          : `<ellipse cx="${cx}" cy="${cy}" rx="${sw / 2 - 2}" ry="${sh / 2 - 1}" style="fill:none;stroke:var(--line-soft);stroke-width:2;stroke-dasharray:5 5"/>`;
      }
    });
    return `<svg class="cairn" viewBox="0 0 ${W} 160" role="img" aria-label="${plural(n, 'stone', 'stones')} of help">${s}</svg>`;
  }
  function stonesSummary() {
    const items = COME.days.map(d => dayRec(d.n)).filter(r => filled(r.trust));
    const stones = items.filter(r => filled(r.happened)).length;
    return `${cairn(stones)}<p class="portrait-count center"><b>${stones}</b>${stones === 1 ? 'stone' : 'stones'} of help</p>${items.length ? `<p class="small muted center">${plural(items.length, 'thing', 'things')} you’ve trusted to Him so far</p>` : ''}`;
  }
  function trustTab() {
    const items = COME.days.map(d => ({ d, r: dayRec(d.n) })).filter(x => filled(x.r.trust));
    let h = `<div class="stack"><section class="leaf"><h2 class="rubric-h">Stones of help</h2><p class="muted">When God helped Israel, Samuel set up a stone and named it Ebenezer, “the stone of help” (1 Samuel 7:12). Look back at what you’ve trusted Jesus with. When you see how He met you, write what happened. Each one becomes a stone of help.</p><div id="stones-summary">${stonesSummary()}</div></section>`;
    if (items.length) {
      h += items.slice().reverse().map(x => `<section class="leaf trust-item${filled(x.r.happened) ? ' has-stone' : ''}" data-trust="${x.d.n}"><div class="trust-head"><span class="stone-dot" aria-hidden="true"></span><a class="sc-label" href="#come-d${x.d.n}">Day ${x.d.n}${x.r.trustAt ? ' · ' + esc(fmtShort(x.r.trustAt)) : ''}</a></div><p class="small muted">I trusted Him with</p><p class="trust-text">${esc(x.r.trust)}</p><label class="q-text-plain" for="hap-${x.d.n}">What happened?</label><textarea class="page-lines" id="hap-${x.d.n}" data-come="${x.d.n}|happened" rows="2" placeholder="Come back later and write how He met you…">${esc(x.r.happened || '')}</textarea></section>`).join('');

  const hints = t => t.trim().split(/\s+/).map(w => { const m = w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9])[A-Za-z0-9'’‘-]*(.*)$/); return m ? m[1] + m[2] + m[3] : w; }).join(' ');
  function versesTab() {
    const c = C();

  function dayView(r) {
    const d = r.d, rec = dayRec(d.n), w = COME.weeks[d.w - 1], c = C();

    return h + `</div>`;
  }
  function dayBar(r) {

    let h = `<div class="stack">`;
    h += `<section class="leaf"><h2 class="rubric-h">At a glance</h2><p class="lead dropcap">${md(g.glance.lead)}</p><dl class="facts">${g.glance.rows.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${md(v)}</dd></div>`).join('')}</dl></section>`;
    h += `<section class="leaf"><h2 class="rubric-h">The world behind ${esc(b.name)}</h2><p class="lead">${md(g.world.lead)}</p>${g.world.groups.map(gr => `<h3 class="group-title">${esc(gr.title)}</h3>${items(gr.items)}`).join('')}</section>`;
    h += `<section class="leaf"><h2 class="rubric-h">Where ${esc(b.name)} fits in the big story</h2><p class="lead">${md(g.story.lead)}</p><div>${g.story.rows.map(([ot, mk, t]) => `<div class="conn"><div class="conn-refs"><span class="conn-ot">${esc(ot)}</span><span class="conn-mark">→ ${esc(mk)}</span></div><p>${md(t)}</p></div>`).join('')}</div><p>${md(g.story.other)}</p></section>`;
    h += `<section class="leaf"><h2 class="rubric-h">How ${esc(b.name)} is built</h2><p class="lead">${md(g.shape.lead)}</p><div class="acts">${act(g.shape.acts[0])}<div class="turn"><span>${esc(g.shape.turn)}</span></div>${act(g.shape.acts[1])}${act(g.shape.acts[2])}</div><p class="small muted" style="text-align:center">${esc(g.shape.sonsLabel)}</p><div class="sons">${g.shape.sons.map(([rf, t]) => `<div><b>${esc(rf)}</b><span>${esc(t)}</span></div>`).join('')}</div><p>${md(g.shape.after)}</p></section>`;
    h += `<section class="leaf"><h2 class="rubric-h">Big themes</h2><p class="lead">${md(g.themes.lead)}</p>${items(g.themes.items)}</section>`;
    h += `<section class="leaf"><h2 class="rubric-h">How to read ${esc(b.name)} well</h2><p class="lead">${md(g.reading.lead)}</p>${items(g.reading.items)}</section>`;
    h += `<section class="leaf"><h2 class="rubric-h">Go deeper</h2><p class="lead">${md(g.deeper.lead)}</p>${items(g.deeper.items)}</section>`;
    h += `<section class="leaf"><h2 class="rubric-h">Key verses to remember</h2><p class="muted">${md(g.verses.lead)}</p><div>${g.verses.rows.map(([rf, t]) => `<div class="verse"><a class="verse-ref" href="${nlt(rf)}" target="_blank" rel="noopener">${esc(rf)}</a><p>${md(t)}</p></div>`).join('')}</div></section>`;
    h += `<section class="leaf"><h2 class="rubric-h">Sources and credits</h2><ul class="list small">${b.sources.map(([n, u, t]) => `<li><a href="${u}" target="_blank" rel="noopener">${esc(n)}</a>: ${esc(t)}</li>`).join('')}</ul><p class="small muted">Bible references point to your NLT. No NLT text is reproduced in this app.</p></section>`;
    return h + `</div>`;
  }
  function quizTab(b) {
    return `<p class="intro-note">Try these from memory once you've finished the sessions, then tap each one to check.</p><div class="stack" style="gap:10px">${b.quiz.map(([q, a], i) => `<details class="q"><summary><b>${i + 1}</b><span>${esc(q)}</span>${ICON.chevDown}</summary><div class="ans"><span class="ans-note">Answer</span>${esc(a)}</div></details>`).join('')}</div>`;
  }
  function sessionView(r) {
    const b = BOOKS[r.book], s = b.sessions[r.n];
    let h = `<header class="session-head"><span class="medallion big">${s.n ? ROMAN[s.n] : ICON.star}</span><p class="eyebrow">${sName(s)} · ${esc(s.ref)}</p><h1>${esc(s.title)}</h1>${s.time ? `<p class="small muted">${esc(s.time)}</p>` : ''}<div class="read-row"><a class="btn btn-line" href="${nlt(s.ref)}" target="_blank" rel="noopener">Read ${esc(s.ref)} in the NLT ${ICON.ext}</a></div></header><div class="stack">`;
    if (s.watch) h += `<section class="leaf"><h2 class="rubric-h">Watch</h2><p>${esc(s.watch.text)} <span class="muted">You’ll need the internet for this one.</span></p><a class="btn btn-quiet" href="${s.watch.url}" target="_blank" rel="noopener">${esc(s.watch.label)} ${ICON.ext}</a></section>`;
    if (s.readNote) h += `<section class="leaf"><h2 class="rubric-h">Read</h2><p>${esc(s.readNote)}</p></section>`;
    if (s.lookFor) h += `<section class="leaf"><h2 class="rubric-h">Look for</h2><ul class="list">${s.lookFor.map(x => `<li>${esc(x)}</li>`).join('')}</ul></section>`;
    if (s.background) h += `<section class="leaf"><h2 class="rubric-h">Background</h2>${s.background.map(p => `<p>${esc(p)}</p>`).join('')}</section>`;
    h += reflectCard(s.reflectTitle || 'Reflect', s.reflect, b.id, 's' + s.n, `ans-${b.id}-s${s.n}`);
    h += `<section class="leaf pray"><h2 class="rubric-h">Pray</h2><p>${esc(s.pray)}</p></section>`;
    return h + `</div>`;
  }
  function sessionBar(r) {
    const b = BOOKS[r.book], n = r.n;
    return bar(n > 0 ? `#${b.id}-s${n - 1}` : null, n < b.sessions.length - 1 ? `#${b.id}-s${n + 1}` : `#${b.id}-quiz`, n < b.sessions.length - 1 ? 'Next session' : 'Go to the quiz', !!data('study-' + b.id).done['s' + n]);
  }

  /* ---------- Render ---------- */
  const grow = t => { if (!t.getClientRects().length) return; t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; };
  const typing = () => { const a = document.activeElement; return !!(a && a.tagName === 'TEXTAREA'); };
  const COME_TABS = [['days', 'Days', ICON.sunrise], ['portrait', 'Portrait', ICON.heart], ['trust', 'Stones', ICON.cairn], ['verses', 'Verses', ICON.bookmark]];
  function render(animate) {
    const r = S.route = parse();
    let body, bottom = '', acc = null;
    if (r.v === 'home') body = homeView();
    else if (r.v === 'come') { body = comeView(r); bottom = tabbar('come', COME_TABS, r.tab); acc = 'come'; }
    else if (r.v === 'day') { body = dayView(r); bottom = dayBar(r); acc = 'come'; }
    else if (r.v === 'help') body = helpView();
    else if (r.v === 'start') { body = startView(); acc = 'come'; }
    else if (r.v === 'finish') { body = finishView(); acc = 'come'; }
    else if (r.v === 'course') { body = courseView(r); bottom = tabbar('story', [['sessions', 'Sessions', ICON.study], ['timeline', 'Timeline', ICON.timeline], ['notes', 'Journal', ICON.notes]], r.tab); acc = 'story'; }
    else if (r.v === 'part') { body = partView(r); bottom = partBar(r); acc = 'story'; }
    else if (r.v === 'book') { body = bookView(r); bottom = tabbar(r.book, [['study', 'Study', ICON.study], ['guide', 'Guide', ICON.guide], ['notes', 'Notes', ICON.notes], ['quiz', 'Quiz', ICON.quiz]], r.tab); acc = BOOKS[r.book].section; }
    else { body = sessionView(r); bottom = sessionBar(r); acc = BOOKS[r.book].section; }
    if (acc) app.style.setProperty('--acc', `var(--s-${acc})`); else app.style.removeProperty('--acc');
    app.innerHTML = `${topbar(r)}<main class="view${animate ? ' enter' : ''}">${body}</main>${bottom}`;
    app.querySelectorAll('textarea').forEach(grow);
  }
  function refresh() { if (typing()) S.pendingRefresh = true; else render(false); }
  document.addEventListener('focusout', () => {
    if (!S.pendingRefresh) return;
    setTimeout(() => { if (S.pendingRefresh && !typing()) { S.pendingRefresh = false; render(false); } }, 60);
  });
  window.addEventListener('hashchange', () => { S.finishAnyway = false; render(true); window.scrollTo(0, 0); });
  document.addEventListener('toggle', e => { if (e.target.tagName === 'DETAILS') e.target.querySelectorAll('textarea').forEach(grow); }, true);

  /* ---------- Actions ---------- */
  let toastTimer = null;
  function toast(msg) {
    const t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3800);
  }
  function toggleDone() {
    const r = S.route;
    if (r.v === 'day') {
      const c = C(), k = 'd' + r.d.n;
      c.days[k] = c.days[k] || {};
      if (c.days[k].done) delete c.days[k].done; else c.days[k].done = Date.now();
      touch('come');
      const el = app.querySelector('.session-bar'); if (el) el.outerHTML = dayBar(r);
      if (c.days[k].done) { const nd = nextDay(); toast(`Day ${r.d.n} finished.${nd ? ` Next time: Day ${nd.n}, ${nd.title}.` : ' That’s all 60 days. Time for the last step.'}`); }
      return;
    }
    if (r.v === 'part') {
      const d = data('study-story'), k = r.p.key;
      if (d.done[k]) delete d.done[k]; else d.done[k] = Date.now();
      touch('study-story');
      const el = app.querySelector('.session-bar'); if (el) el.outerHTML = partBar(r);
      if (d.done[k]) { const np = nextPart(); toast(`${partName(r.p)} complete.${np ? ' Next: ' + np.title + '.' : ' That completes Session 1.'}`); }
      return;
    }
    if (r.v !== 'session') return;
    const b = BOOKS[r.book], d = data('study-' + b.id), k = 's' + r.n;
    if (d.done[k]) delete d.done[k]; else d.done[k] = Date.now();
    touch('study-' + b.id);
    const el = app.querySelector('.session-bar'); if (el) el.outerHTML = sessionBar(r);
    if (d.done[k]) { const nx = nextSession(b.id); toast(`${sName(b.sessions[r.n])} complete.${nx ? ' Next: ' + nx.title + '.' : ' You have finished ' + b.name + '. Try the quiz.'}`); }
  }
  function seal() {
    const c = C();
    if (!filled(c.start.text) || c.start.sealedAt) return;
    if (!confirm('Seal your answer? You won’t be able to read or change it until the end of the 60 days.')) return;
    c.start.sealedAt = Date.now();
    touch('come');
    render(false); window.scrollTo(0, 0);
    toast('Sealed. Day 1 is ready when you are.');
  }
  function openFirst() {
    const c = C();
    if (!filled(c.finish.text)) return;
    c.finish.openedAt = Date.now();
    touch('come');
    render(false); window.scrollTo(0, 0);
  }

  /* Notes as readable text */
  function exportText() {
    const today = fmtDate(Date.now());
    let out = `# The Word of God: my notes\n\nCopied ${today}\n`;
    const c = C(), parts = [];
    if (filled(c.start.text)) parts.push(c.finish.openedAt ? `## Who do you say I am? At the start${c.start.sealedAt ? ', ' + fmtDate(c.start.sealedAt) : ''}\n\n${c.start.text.trim()}` : `## Who do you say I am? At the start\n\n_Sealed until the end of the 60 days._`);
    COME.days.forEach(d => {
      const r = c.days['d' + d.n];
      if (!r) return;
      const bits = [];
      if (filled(r.see)) bits.push(`**Today I saw that Jesus…** ${r.see.trim()}`);
      if (filled(r.deep)) bits.push(`**${d.q}**\n\n${r.deep.trim()}`);
      if (filled(r.trust)) bits.push(`**Today I’ll trust Him with…** ${r.trust.trim()}`);
      if (filled(r.happened)) bits.push(`**What happened:** ${r.happened.trim()}`);
      if (bits.length) parts.push(`## Day ${d.n}: ${d.title} (${d.ref})${r.done ? ', finished' : ''}\n\n${bits.join('\n\n')}`);
    });
    COME.weeks.forEach(w => { const v = c.verses['w' + w.n]; if (v && filled(v.text)) parts.push(`## Week ${w.n} verse: ${w.verse}${v.known ? ', learnt' : ''}\n\n${v.text.trim()}`); });
    if (filled(c.finish.text)) parts.push(`## Who do you say I am? At the end\n\n${c.finish.text.trim()}`);
    out += `\n# Come and See\n\n${parts.length ? parts.join('\n\n') : '_Nothing written yet._'}\n`;
    const section = (store, name, groups) => {
      const n = data('notes-' + store), d = data('study-' + store), ps = [];
      if ((n.text || '').trim()) ps.push(`## Journal\n\n${n.text.trim()}`);
      groups.forEach(g => {
        const qa = g.qs.map((q, i) => [q, (d.answers[`${g.prefix}-${i}`] || '').trim()]).filter(x => x[1]);
        if (qa.length) ps.push(`## ${g.label}${d.done[g.prefix] ? ', completed' : ''}\n\n` + qa.map(([q, a]) => `**${q}**\n\n${a}`).join('\n\n'));
      });
      out += `\n# ${name}\n\n${ps.length ? ps.join('\n\n') : '_Nothing written yet._'}\n`;
    };
    section('story', COURSE.name, PARTS.map(p => ({ label: `${partName(p)}: ${p.title}`, qs: p.reflect, prefix: p.key })));
    Object.keys(BOOKS).forEach(id => section(id, BOOKS[id].name, BOOKS[id].sessions.map(s => ({ label: `${sName(s)}: ${s.title} (${s.ref})`, qs: s.reflect, prefix: 's' + s.n }))));
    return out;
  }
  async function copyText(text, okMsg, fileName) {
    try { await navigator.clipboard.writeText(text); toast(okMsg); return; } catch (e) { /* fall through */ }
    const res = await saveFile(fileName, text, 'text/plain');
    if (res === 'shared' || res === 'downloaded') toast('Saved as a text file.');
    else if (res !== 'cancelled') toast('Copying isn’t available on this device.');
  }
  function copyNotes() { copyText(exportText(), 'Your notes are copied. Paste them into Notes or an email.', 'word-of-god-notes.txt'); }
  function copyPortrait() {
    const lines = COME.days.map(d => ({ d, t: (dayRec(d.n).see || '').trim() })).filter(x => x.t).map(x => `Day ${x.d.n} (${x.d.ref}): ${x.t}`);
    copyText(`My portrait of Jesus\n\n${lines.join('\n\n')}\n`, 'Your portrait is copied. Paste it into Notes or a message.', 'my-portrait-of-jesus.txt');
  }

  /* Backup and restore */
  async function saveFile(name, text, type) {
    const blob = new Blob([text], { type });
    try {
      const file = new File([blob], name, { type });
      if (navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return 'shared'; }
    } catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; }
    try {
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = name; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      return 'downloaded';
    } catch (e) { return 'failed'; }
  }
  function backupObject() {
    const out = { app: 'the-word-of-god', format: 1, savedAt: new Date().toISOString(), data: {} };
    KEYS.forEach(k => { const v = mem[k] || lsGet(k); if (v && v.updatedAt) out.data[k] = v; });
    return out;
  }
  async function backup() {
    const name = `word-of-god-backup-${new Date().toISOString().slice(0, 10)}.json`;
    const res = await saveFile(name, JSON.stringify(backupObject(), null, 1), 'application/json');
    if (res === 'shared' || res === 'downloaded') toast('Backup made. Keep it somewhere safe, such as Files or an email to yourself.');
    else if (res === 'failed') toast('That didn’t work here. Try “Copy as text” instead.');
  }
  function restore() {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json,text/plain'; inp.style.display = 'none';
    inp.addEventListener('change', () => {
      const f = inp.files && inp.files[0];
      inp.remove();
      if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        let obj = null;
        try { obj = JSON.parse(rd.result); } catch (e) { obj = null; }
        if (!obj || obj.app !== 'the-word-of-god' || !obj.data || typeof obj.data !== 'object') { toast('That file isn’t a Word of God backup.'); return; }
        const when = obj.savedAt && !isNaN(Date.parse(obj.savedAt)) ? fmtDate(Date.parse(obj.savedAt)) : 'an earlier date';
        if (!confirm(`Restore your notes from the backup made on ${when}? This replaces everything on this phone now.`)) return;
        let ok = true;
        KEYS.forEach(k => {
          if (obj.data[k] && typeof obj.data[k] === 'object') { if (!lsSet(k, obj.data[k])) ok = false; }
          else { try { localStorage.removeItem(LS + k); } catch (e) { /* ignore */ } }
          delete mem[k];
        });
        render(false);
        toast(ok ? 'Your notes have been restored.' : 'Some notes couldn’t be restored. Check you have free storage.');
      };
      rd.onerror = () => toast('That file couldn’t be read.');
      rd.readAsText(f);
    });
    document.body.appendChild(inp);
    inp.click();
  }

  /* Links that need the internet */
  document.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a[target="_blank"]');
    if (a && navigator.onLine === false) {
      e.preventDefault();
      toast(a.href.indexOf('biblegateway') > -1 ? 'You’re offline, so use your printed Bible for this one.' : 'You’re offline. This link needs the internet.');
    }
  }, true);

  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act],[data-soon],[data-tab]');
    if (!t) return;
    if (t.hasAttribute('data-tab')) { e.preventDefault(); location.replace(t.getAttribute('href')); return; }
    if (t.dataset.soon) { toast(t.dataset.soon === 'John' ? 'A John book study is coming. For now, walk through John day by day in Come and See.' : `${t.dataset.soon} is coming soon. We're adding one book at a time.`); return; }
    const a = t.dataset.act, w = t.dataset.w;
    if (a === 'done') toggleDone();
    else if (a === 'backup') backup();
    else if (a === 'copy-notes') copyNotes();
    else if (a === 'copy-portrait') copyPortrait();
    else if (a === 'restore') restore();
    else if (a === 'status') toast(STATUS_HELP[S.status]);
    else if (a === 'offline') toast(OFF_HELP[S.offline]);
    else if (a === 'seal') seal();
    else if (a === 'open-first') openFirst();
    else if (a === 'finish-anyway') { S.finishAnyway = true; render(false); }
    else if (a === 'practise') { S.practise[w] = !S.practise[w]; S.reveal[w] = false; render(false); }
    else if (a === 'reveal') { S.reveal[w] = !S.reveal[w]; render(false); }
    else if (a === 'known') {
      const c = C(), k = 'w' + w; c.verses[k] = c.verses[k] || {};
      if (c.verses[k].known) delete c.verses[k].known; else c.verses[k].known = Date.now();
      touch('come'); render(false);
      if (c.verses[k].known) toast('Learnt by heart. Well done.');
    }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset && t.dataset.share) {
      const c = C(), k = 'w' + t.dataset.share;
      if (t.checked) c.share[k] = Date.now(); else delete c.share[k];
      touch('come');
    }
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.tagName === 'TEXTAREA') grow(t);
    if (t.dataset.ans) { const [store, key] = t.dataset.ans.split('|'); data('study-' + store).answers[key] = t.value; touch('study-' + store); }
    else if (t.dataset.notes) { data('notes-' + t.dataset.notes).text = t.value; touch('notes-' + t.dataset.notes); }
    else if (t.dataset.come) {
      const [where, field] = t.dataset.come.split('|'), c = C();
      if (where === 'start') {
        if (c.start.sealedAt) return;
        c.start.text = t.value; touch('come');
        const b = app.querySelector('[data-act="seal"]'); if (b) b.disabled = !filled(t.value);
      } else if (where === 'finish') {
        if (c.finish.openedAt) return;
        c.finish.text = t.value; touch('come');
        const b = app.querySelector('[data-act="open-first"]'); if (b) b.disabled = !filled(t.value);
      } else {
        const k = 'd' + where;
        c.days[k] = c.days[k] || {};
        c.days[k][field] = t.value;
        if (filled(t.value) && !c.days[k][field + 'At']) c.days[k][field + 'At'] = Date.now();
        touch('come');
        if (field === 'happened') {
          const card = t.closest('[data-trust]'); if (card) card.classList.toggle('has-stone', filled(t.value));
          const sum = document.getElementById('stones-summary'); if (sum) sum.innerHTML = stonesSummary();
        }
      }
    }
    else if (t.dataset.verse) {
      const c = C(), k = 'w' + t.dataset.verse;
      c.verses[k] = c.verses[k] || {};
      c.verses[k].text = t.value; touch('come');
      const b = app.querySelector(`[data-act="practise"][data-w="${t.dataset.verse}"]`); if (b) b.disabled = !filled(t.value);
    }
  });

  render(false);
  setupOffline();
})();

</script>
</body>
</html>
